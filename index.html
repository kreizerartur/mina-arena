<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Минная арена</title>
  <link rel="stylesheet" href="style.css?v=202611242311">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="score"></div>
      <div id="timer">2:00</div>
      <button id="btnMenu" aria-label="Пауза и настройки">⏸</button>
    </header>

    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="banner" class="hidden"></div>
      <div id="hint" class="hidden"></div>
    </div>

    <div id="controls">
      <div id="stickZone"><div id="stick"><i class="arr u"></i><i class="arr r"></i><i class="arr d"></i><i class="arr l"></i><div id="knob"></div></div></div>
      <div id="btns">
        <button id="btnMine"><b>МИНА</b><small>E</small></button>
        <button id="btnFire"><b>ОГОНЬ</b><small>пробел</small></button>
      </div>
      <button id="btnSkip" class="hidden"><b>Пропустить раунд ⏭</b><small>сразу к результату</small></button>
    </div>

    <div id="screen" class="overlay">
      <h1>Минная арена</h1>
      <p class="sub">Загрузка…</p>
    </div>
  </div>
  <script type="module" src="js/main.js?v=202611242311"></script>
</body>
</html>
